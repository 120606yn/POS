{% extends "base.html" %}
{% block title %}Màn hình bếp{% endblock %}
{% block page_title %}<i class="fas fa-fire text-accent" style="margin-right:8px"></i>Màn hình Bếp{% endblock %}

{% block head %}
<style>
.kitchen-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    gap: 16px; 
}
.kitchen-card {
    border-radius: 14px; padding: 18px;
    border: 2px solid;
    position: relative; overflow: hidden;
    animation: fadeIn .3s ease;
}
.kitchen-card.cooking { 
    border-color: rgba(232,64,64,.5); 
    background: rgba(232,64,64,.05);
}
.kitchen-card.pending { 
    border-color: rgba(232,160,32,.5); 
    background: rgba(232,160,32,.04);
}
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

.kitchen-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.order-num { font-size:20px; font-weight:800; }
.order-table { font-size:13px; background:rgba(255,255,255,.08); padding:4px 10px; border-radius:20px; }
.order-time { font-size:12px; color:var(--text3); }

.kitchen-items { margin-bottom:14px; }
.kitchen-item { 
    display:flex; align-items:center; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06);
}
.kitchen-item:last-child { border-bottom:none; }
.item-qty-circle {
    width:32px; height:32px; border-radius:50%;
    background:rgba(232,64,64,.2); color:var(--red);
    font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
}
.cooking .item-qty-circle { background:rgba(232,64,64,.2); color:var(--red); }
.pending .item-qty-circle { background:rgba(232,160,32,.2); color:var(--accent); }
.item-info { flex:1; }
.item-item-name { font-size:14px; font-weight:600; }
.item-note { font-size:12px; color:var(--text3); margin-top:2px; }

.ready-btn {
    width:100%; padding:12px; border-radius:10px;
    background:var(--green); border:none; color:white;
    font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; transition:.2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
}
.ready-btn:hover { filter:brightness(1.1); }

.elapsed-time { 
    font-size:12px; font-weight:700; 
    padding:4px 10px; border-radius:20px;
}
.elapsed-ok { background:rgba(40,199,111,.15); color:var(--green); }
.elapsed-warn { background:rgba(232,160,32,.15); color:var(--accent); }
.elapsed-over { background:rgba(232,64,64,.15); color:var(--red); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.6; } }

.kitchen-empty { text-align:center; padding:80px 20px; color:var(--text3); }
.kitchen-empty i { font-size:60px; margin-bottom:16px; display:block; opacity:.2; }
.kitchen-empty h2 { font-size:20px; margin-bottom:8px; }

.kitchen-toolbar { 
    display:flex; align-items:center; gap:12px; 
    margin-bottom:20px; padding:14px 16px;
    background:var(--card); border-radius:10px; border:1px solid var(--border);
}
.live-dot { 
    width:10px; height:10px; border-radius:50%; background:var(--green);
    animation:blink 1.5s infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
</style>
{% endblock %}

{% block content %}
<div class="kitchen-toolbar">
    <div class="live-dot"></div>
    <span class="text-sm text-muted">Tự động cập nhật mỗi 10 giây</span>
    <span class="text-sm" id="last-update" style="margin-left:auto"></span>
    <button class="btn btn-secondary btn-sm" onclick="loadOrders()">
        <i class="fas fa-sync-alt"></i> Làm mới
    </button>
</div>

<div class="kitchen-grid" id="kitchen-grid">
    <div class="kitchen-empty">
        <i class="fas fa-spinner fa-spin"></i>
        <h2>Đang tải...</h2>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadOrders() {
    try {
        const r = await fetch('/api/kitchen/orders');
        const orders = await r.json();
        renderOrders(orders);
        document.getElementById('last-update').textContent = 'Cập nhật: ' + new Date().toLocaleTimeString('vi-VN');
    } catch(e) {
        console.error(e);
    }
}

function getElapsed(dateStr) {
    const now = new Date();
    const created = new Date(dateStr);
    return Math.floor((now - created) / 60000); // minutes
}

function renderOrders(orders) {
    const grid = document.getElementById('kitchen-grid');
    
    if (!orders.length) {
        grid.innerHTML = `
        <div class="kitchen-empty" style="grid-column:1/-1">
            <i class="fas fa-check-circle"></i>
            <h2>Không có đơn nào đang chờ!</h2>
            <p>Tất cả đơn đã được xử lý xong 🎉</p>
        </div>`;
        return;
    }
    
    grid.innerHTML = orders.map(order => {
        const mins = getElapsed(order.created_at);
        let elapsedClass = 'elapsed-ok';
        let elapsedIcon = '✅';
        if (mins >= 20) { elapsedClass = 'elapsed-over'; elapsedIcon = '🚨'; }
        else if (mins >= 10) { elapsedClass = 'elapsed-warn'; elapsedIcon = '⚠️'; }
        
        const items = order.items.map(item => `
        <div class="kitchen-item">
            <div class="item-qty-circle">${item.quantity}</div>
            <div class="item-info">
                <div class="item-item-name">${item.name}</div>
                ${item.notes ? `<div class="item-note">📝 ${item.notes}</div>` : ''}
            </div>
        </div>`).join('');
        
        return `
        <div class="kitchen-card ${order.status}" id="order-${order.id}">
            <div class="kitchen-card-header">
                <div>
                    <div class="order-num text-accent">#${order.id}</div>
                    <div class="order-time">${new Date(order.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'})}</div>
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px">
                    <span class="order-table"> ${order.table_number || 'Mang về'}</span>
                    <span class="${elapsedClass} elapsed-time">${elapsedIcon} ${mins} phút</span>
                </div>
            </div>
            <div class="kitchen-items">${items}</div>
            ${order.notes ? `<div style="font-size:12px; color:var(--text3); margin-bottom:12px; padding:8px; background:rgba(255,255,255,.04); border-radius:6px">📝 ${order.notes}</div>` : ''}
            <button class="ready-btn" onclick="markReady(${order.id})">
                <i class="fas fa-check"></i> Xong! Gọi phục vụ
            </button>
        </div>`;
    }).join('');
}

async function markReady(id) {
    const card = document.getElementById('order-' + id);
    if (card) { card.style.opacity = '.5'; card.style.pointerEvents = 'none'; }
    
    const r = await fetch(`/api/kitchen/ready/${id}`, {method:'POST'});
    const d = await r.json();
    if (d.success) {
        toast('✅ Đơn #' + id + ' đã sẵn sàng!');
        setTimeout(() => loadOrders(), 500);
    }
}

// Load initially and auto-refresh
loadOrders();
setInterval(loadOrders, 10000);
</script>
{% endblock %}
