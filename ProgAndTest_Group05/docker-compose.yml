version: "3.9"
                                                                                                                                              
services:
  db:
    image: mysql:8
    container_name: restaurant-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: restaurant
      TZ: Asia/Ho_Chi_Minh
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+07:00'
    ports:
      - "3307:3306"
    volumes:
      - ./app/database.sql:/docker-entrypoint-initdb.d/database.sql

  web:
    build: .
    container_name: restaurant-web
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: restaurant